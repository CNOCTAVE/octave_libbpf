# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Build and Publish

on:
  release:
    types: [created]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'octave_libbpf'
      # uncomment this on demand
      # - run: sudo chmod a+x octave_libbpf/src/configure
      # uncomment this on demand
      - run: sudo chmod -R a+x octave_libbpf/inst
      - run: tar --warning=no-file-changed --exclude='octave_libbpf/.git' --exclude='octave_libbpf/.github' -czvf octave_libbpf.tar.gz octave_libbpf
      - run: gh release upload 0.1.0 octave_libbpf.tar.gz --repo $GITHUB_REPOSITORY
